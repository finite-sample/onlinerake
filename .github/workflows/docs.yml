name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    # Job-level, not workflow-level: `permissions:` grants above the repository
    # default, and the default here is read-only.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "latest"
    - name: Set up Python
      run: uv python install
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y pandoc
    - name: Install dependencies
      run: uv sync --extra docs
    - name: Build documentation
      run: |
        cd docs
        # Execute notebooks first to ensure they work and generate outputs
        uv run jupyter nbconvert --to notebook --execute notebooks/01_getting_started.ipynb --inplace
        uv run jupyter nbconvert --to notebook --execute notebooks/02_performance_comparison.ipynb --inplace
        uv run jupyter nbconvert --to notebook --execute notebooks/03_advanced_diagnostics.ipynb --inplace
        # Build docs with executed notebooks
        uv run sphinx-build -b html . _build/html

    # Deploy only from main. The three steps below are what needs the
    # `github-pages` environment, and that environment carries a branch policy,
    # so a pull request cannot reach them. Guarding the steps -- rather than
    # declaring `environment:` on the job -- is what lets a PR still build.
    - name: Setup Pages
      uses: actions/configure-pages@v6
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      with:
        path: 'docs/_build/html'
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
